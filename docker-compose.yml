# Local development stack for the API.
#
# The database, auth and REST services are NOT defined here. `supabase start`
# owns those, and a second orchestrator managing the same containers would
# fight it over networks, volumes and published ports. Start them first:
#
#   npm run dev
#
# which runs `supabase start` and then this file.

name: mangopos

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mangolabs/pos-api:dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      # Inside a container 127.0.0.1 is the container itself, not the host, so
      # the host-side values in .env cannot be reused verbatim.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
