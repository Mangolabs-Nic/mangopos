name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/rebuild-docs/**"
      - "turbo.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/rebuild-docs/**"
      - "turbo.json"
      - "package.json"
      - "package-lock.json"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mangolabs/mangopos-docs

      # Combine landing page + docs into single artifact
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          # Copy landing page assets from repo root
          cp index.html _site/
          cp -r images _site/ 2>/dev/null || true
          cp icon.svg _site/ 2>/dev/null || true
          cp version.json _site/ 2>/dev/null || true
          cp devmessage.json _site/ 2>/dev/null || true
          cp style.css _site/ 2>/dev/null || true
          # Copy Docusaurus build output under /docs/
          cp -r apps/rebuild-docs/build _site/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
